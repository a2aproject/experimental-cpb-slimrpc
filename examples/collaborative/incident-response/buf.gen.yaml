version: v2
inputs:
  - directory: ../../proto/v1
plugins:
  # Generate Python protobuf message classes (no new messages in this proto,
  # but the file descriptor is needed for service registration).
  - remote: buf.build/protocolbuffers/python:v29.3
    out: generated

  # Generate SLIMRPC stubs: Servicer base, handler internals, Stub, GroupStub.
  # `types_import` tells the plugin where to find the lf.a2a.v1.Message class
  # at runtime (from the a2a Python package).
  - local: protoc-gen-slimrpc-python
    out: generated
    opt:
      - 'types_import=from a2a.types import a2a_pb2 as a2a__pb2'
